<script>
  (function () {
    const el = document.getElementById('heading-text');
    const segments = [
      { text: 'Hi,', hi: true },
      { text: " I'm Sojin", hi: false }
    ];
    const allChars = [];
    for (const seg of segments) {
      for (const char of seg.text) allChars.push({ char, hi: seg.hi });
    }

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    el.appendChild(cursor);

    const pauseAfter = 'Hi,'.length - 1;
    let i = 0;
    function typeNext() {
      if (i >= allChars.length) {
        setTimeout(() => {
          cursor.style.transition = 'opacity 0.5s';
          cursor.style.opacity = '0';
          setTimeout(() => cursor.remove(), 500);
        }, 900);
        return;
      }
      const { char, hi } = allChars[i];
      const span = document.createElement('span');
      if (hi) span.className = 'heading-hi';
      span.textContent = char === ' ' ? ' ' : char;
      el.insertBefore(span, cursor);
      const delay = i === pauseAfter ? 520 : 130;
      i++;
      setTimeout(typeNext, delay);
    }
    typeNext();
  })();
</script>

<script src="js/chat.js"></script>
<script>
  const chatToggle      = document.getElementById('chat-toggle');
  const chatToggleBadge = document.getElementById('chat-toggle-badge');
  const chatWidget      = document.getElementById('chat-widget');
  const chatWidgetClose = document.getElementById('chat-widget-close');

  let chatStarted = false;

  function openChat() {
    chatWidget.classList.remove('hidden');
    chatToggle.classList.add('hidden');
    chatToggleBadge.classList.remove('show');
    if (!chatStarted) { chatStarted = true; initChat(); }
  }

  chatToggle.addEventListener('click', openChat);
  chatWidgetClose.addEventListener('click', () => {
    chatWidget.classList.add('hidden');
    chatToggle.classList.remove('hidden');
  });

  // ── Survey "live message" — fires once, 3 minutes after page load ──
  function addCard(html) {
    const row = document.createElement('div');
    row.className = 'bubble-in-row';
    row.innerHTML = html;
    chatScroll.insertBefore(row, choicesAnchor);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      row.classList.add('show');
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }));
    return row;
  }

  function showSurvey() {
    if (document.getElementById('survey-card')) return;
    if (!chatStarted) { chatStarted = true; initChat(); }

    addSystemNote('NEW MESSAGE');
    const card = addCard(`
      <div class="survey-card" id="survey-card">
        <div class="survey-title">Did you find what you were looking for?</div>
        <div class="survey-emojis">
          <button class="survey-emoji" data-label="Not at all">😞<span>Not at all</span></button>
          <button class="survey-emoji" data-label="Not really">🙁<span>Not really</span></button>
          <button class="survey-emoji" data-label="Somewhat">😐<span>Somewhat</span></button>
          <button class="survey-emoji" data-label="Mostly">🙂<span>Mostly</span></button>
          <button class="survey-emoji" data-label="Yes!">😄<span>Yes!</span></button>
        </div>
        <button class="survey-submit" id="survey-submit" disabled>Submit</button>
      </div>
    `);

    let selected = null;
    const submitBtn = card.querySelector('#survey-submit');
    card.querySelectorAll('.survey-emoji').forEach(btn => {
      btn.addEventListener('click', () => {
        card.querySelectorAll('.survey-emoji').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selected = btn.dataset.label;
        submitBtn.disabled = false;
      });
    });

    submitBtn.addEventListener('click', () => {
      card.querySelector('.survey-emojis').style.pointerEvents = 'none';
      submitBtn.outerHTML = '<div class="survey-thanks">Thanks for the feedback! 🙏</div>';
    });

    if (chatWidget.classList.contains('hidden')) {
      chatToggleBadge.classList.add('show');
      chatToggle.classList.add('bump');
      setTimeout(() => chatToggle.classList.remove('bump'), 800);
    }
  }

  setTimeout(showSurvey, 3 * 60 * 1000);
</script>

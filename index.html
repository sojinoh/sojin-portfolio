<script>
  (function () {
    const el = document.getElementById('heading-text');
    const segments = [
      { text: 'Hi,', hi: true },
      { text: " I'm Sojin", hi: false }
    ];
    const allChars = [];
    for (const seg of segments) {
      for (const char of seg.text) allChars.push({ char, hi: seg.hi });
    }

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    el.appendChild(cursor);

    const pauseAfter = 'Hi,'.length - 1;
    let i = 0;
    function typeNext() {
      if (i >= allChars.length) {
        setTimeout(() => {
          cursor.style.transition = 'opacity 0.5s';
          cursor.style.opacity = '0';
          setTimeout(() => cursor.remove(), 500);
        }, 900);
        return;
      }
      const { char, hi } = allChars[i];
      const span = document.createElement('span');
      if (hi) span.className = 'heading-hi';
      span.textContent = char === ' ' ? ' ' : char;
      el.insertBefore(span, cursor);
      const delay = i === pauseAfter ? 520 : 130;
      i++;
      setTimeout(typeNext, delay);
    }
    typeNext();
  })();
</script>
<script>
  document.querySelectorAll('.nav-img-link, .cta, .cta-secondary, .social-icon').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('doodle-reacting'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('doodle-reacting'));
  });
</script>
<script>
  (function () {
    const hero = document.querySelector('.hero');
    if (!hero) return;
    const RANGE = 22;
    hero.addEventListener('mousemove', e => {
      const rect = hero.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      hero.style.setProperty('--mx', (nx * RANGE).toFixed(1));
      hero.style.setProperty('--my', (ny * RANGE).toFixed(1));
    });
    hero.addEventListener('mouseleave', () => {
      hero.style.setProperty('--mx', 0);
      hero.style.setProperty('--my', 0);
    });
  })();
</script>

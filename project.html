<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const fromCategory = params.get('from');
  if (fromCategory) {
    document.querySelector('.project-detail-back').href = 'work.html?category=' + fromCategory;
  }
  if (!slug) {
    window.location.replace('work.html');
  } else {
    fetch('work.html')
      .then(r => r.text())
      .then(html => new DOMParser().parseFromString(html, 'text/html'))
      .then(doc => {
        const card = doc.querySelector(`.work-card[data-slug="${slug}"]`);
        if (!card) { window.location.replace('work.html'); return; }

        const password = card.dataset.password;
        if (password && sessionStorage.getItem('project-pw-' + slug) !== password) {
          showGate(card, password, slug);
          return;
        }

        renderProject(card);
      })
      .catch(() => { window.location.replace('work.html'); });
  }

  function showGate(card, password, slug) {
    document.getElementById('project-loading').style.display = 'none';
    document.getElementById('project-gate').classList.remove('hidden');

    const input = document.getElementById('gate-input');
    const error = document.getElementById('gate-error');

    function tryUnlock() {
      if (input.value === password) {
        sessionStorage.setItem('project-pw-' + slug, password);
        document.getElementById('project-gate').classList.add('hidden');
        renderProject(card);
      } else {
        error.classList.remove('hidden');
        input.classList.add('gate-shake');
        setTimeout(() => input.classList.remove('gate-shake'), 400);
        input.value = '';
        input.focus();
      }
    }

    document.getElementById('gate-submit').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
    setTimeout(() => input.focus(), 50);
  }

  function renderProject(card) {
    document.title = card.dataset.title + ' — Sojin Oh';
    document.getElementById('pd-title').textContent   = card.dataset.title;
    document.getElementById('pd-context').textContent = card.dataset.context;
    document.getElementById('pd-tags').innerHTML      = card.querySelector('.work-card-tags').innerHTML;

    const pdDesc = document.getElementById('pd-desc');
    mountProjectDesc(pdDesc, card);

    const pdRepo = document.getElementById('pd-repo');
    if (card.dataset.repo) {
      pdRepo.href = card.dataset.repo;
      pdRepo.classList.remove('hidden');
    }

    document.getElementById('project-loading').style.display = 'none';
    document.getElementById('project-detail').classList.remove('hidden');

    const lightbox = createLightbox();
    lightbox.wireContainer(pdDesc);

    // Content loads after the page, so jump to a #chapter link once it exists
    // and the images above it have loaded (otherwise they push it down).
    const target = location.hash && document.getElementById(location.hash.slice(1));
    if (target) {
      const pending = [...pdDesc.querySelectorAll('img')].filter(img => !img.complete)
        .map(img => new Promise(r => { img.onload = img.onerror = r; }));
      Promise.all(pending).then(() => target.scrollIntoView());
    }
  }
</script>
